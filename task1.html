<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styled Webpage with JavaScript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
    }

    header {
      background-color:purple;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      padding: 40px;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
    }

    p {
      font-size: 1.2em;
      color: #333;
      margin-bottom: 30px;
    }

    button {
      background-color: red;
      color: white;
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Styled Webpage</h1>
  </header>

  <main>
    <p>Click the button below to see a message.</p>
    <button onclick="showMessage()">Click Me</button>
  </main>

  <script>
    function showMessage() {
      alert("Hello! You clicked the button!");
    }
  </script>

</body>
</html>
